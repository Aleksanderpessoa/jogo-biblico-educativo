<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Bíblico Avançado - Teste</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="cabecalho">
            <h1 class="titulo">Jogo Bíblico Avançado - Teste</h1>
            <div class="nivel-indicador">
                <span class="nivel-texto">Nível 2 - Estudante Bíblico</span>
                <div class="nivel-progresso">
                    <div class="nivel-barra"></div>
                </div>
            </div>
            
            <div class="placar">
                <div class="placar-item">
                    <div class="placar-label">Acertos</div>
                    <div class="placar-valor acertos" id="acertos">0</div>
                </div>
                <div class="placar-item">
                    <div class="placar-label">Erros</div>
                    <div class="placar-valor erros" id="erros">0</div>
                </div>
                <div class="placar-item">
                    <div class="placar-label">Livros</div>
                    <div class="placar-valor livros" id="livros-concluidos">0</div>
                </div>
            </div>
            
            <p class="texto-motivacional">
                Página de teste do nível avançado!
            </p>
        </header>

        <main class="area-jogo">
            <section class="area-livro">
                <h2 class="titulo-livro">Teste - Página Avançada</h2>
                <div class="livro-container">
                    <div class="livro-selecao">
                        <p>Se você está vendo esta página, o deploy funcionou!</p>
                        <p>Aguarde alguns minutos para o GitHub Pages atualizar completamente.</p>
                        <button class="btn-sortear" onclick="alert('Teste funcionando!')">
                            Testar Funcionalidade
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
